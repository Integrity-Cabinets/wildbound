<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wildbound — Chapter One</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#0b0f14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#252935}
button{font-family:inherit}
/* ---------- overworld ---------- */
#game{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.dof{position:absolute;left:0;right:0;pointer-events:none}
#dof1{top:0;height:44%;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
#dof2{top:0;height:26%;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
#dof3{bottom:0;height:15%;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(transparent,#000 85%);mask-image:linear-gradient(transparent,#000 85%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 55%,transparent 55%,rgba(6,8,22,.5))}
#banner{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;padding:10px 18px;background:#fbf8ef;border:3px solid #33384a;border-radius:8px;box-shadow:inset 0 0 0 2px #e6d9b8,0 4px 0 rgba(0,0,0,.25);font-weight:800;font-size:clamp(13px,1.7vw,16px);letter-spacing:.1em;transform:translateY(-170%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#banner.show{transform:none}
#topbtns{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
.tbtn{min-width:44px;height:40px;padding:0 12px;border-radius:9px;border:2px solid rgba(255,255,255,.55);background:rgba(20,26,40,.45);color:#fff;font:700 13px ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#ctrl{transition:opacity .2s}
#ctrl.hide{opacity:0;pointer-events:none}
#dpad{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:144px;height:144px;border-radius:50%;background:rgba(15,20,32,.28);border:2px solid rgba(255,255,255,.25);touch-action:none}
#dpad .arm{position:absolute;background:rgba(255,255,255,.82);border:2px solid #2b2f3d;border-radius:7px}
#dpad .h{left:22px;right:22px;top:54px;height:36px}
#dpad .v{top:22px;bottom:22px;left:54px;width:36px}
#dpad .hub{position:absolute;left:57px;top:57px;width:30px;height:30px;background:rgba(255,255,255,.82);border-radius:4px}
#dpad .ar{position:absolute;width:0;height:0;border:8px solid transparent}
#dpad .au{left:64px;top:28px;border-bottom-color:#2b2f3d}
#dpad .ad{left:64px;bottom:28px;border-top-color:#2b2f3d}
#dpad .al{top:64px;left:28px;border-right-color:#2b2f3d}
#dpad .aR{top:64px;right:28px;border-left-color:#2b2f3d}
.rb{position:absolute;border-radius:50%;border:3px solid #2b2f3d;display:flex;align-items:center;justify-content:center;font:800 20px ui-monospace,Menlo,monospace;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:none;text-align:center}
.rb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#btnA{right:calc(18px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));width:70px;height:70px;background:#d6493f}
#btnB{right:calc(98px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;background:#3f6fd6;font-size:17px}
#btnB small{display:block;font-size:9px;margin-top:-2px;opacity:.85}
@media (pointer:fine){#dpad,.rb{opacity:.55}}
#dlg{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto;min-height:132px;padding:22px 28px 30px;background:linear-gradient(180deg,#fdfaf2,#f6f0df);border:4px solid #33384a;border-radius:14px;box-shadow:inset 0 0 0 3px #e6d9b8,0 6px 0 rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.28);font-size:clamp(17px,2.05vw,21px);line-height:1.5;font-weight:600;display:none;z-index:12;transform-origin:50% 100%}
#dlg.pop{animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.25)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
#dlg.hasPort{padding-left:172px}
#port{position:absolute;left:14px;bottom:10px;width:144px;height:144px;image-rendering:pixelated;image-rendering:crisp-edges;display:none;transform-origin:50% 100%}
#port.nod{animation:nod .28s ease-out}
@keyframes nod{35%{transform:translateY(-5px) scale(1.03)}}
#dlg.hasPort #port{display:block}
#dlg .nm{position:absolute;top:-21px;left:20px;background:linear-gradient(180deg,#3c4257,#2a2e3d);color:#f6dc93;font-size:clamp(13px,1.5vw,15px);padding:5px 15px;border-radius:7px;letter-spacing:.09em;border:1px solid #d6b46a;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#dlg.hasPort .nm{left:172px}
#dlg .nm:empty{display:none}
#dlg .more{position:absolute;right:20px;bottom:8px;color:#d0453a;font-size:16px;animation:bob .5s infinite alternate;display:none}
@keyframes bob{to{transform:translateY(3px)}}
@media (max-width:520px){#dlg{font-size:16px;min-height:116px;padding:17px 16px 24px}#dlg.hasPort{padding-left:112px}#port{width:100px;height:100px;left:6px;bottom:8px}#dlg.hasPort .nm{left:112px}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15}
#flash.go{animation:fl .9s steps(1) forwards}
@keyframes fl{0%{opacity:1}15%{opacity:0}30%{opacity:1}45%{opacity:0}60%{opacity:1}75%{opacity:0;background:#000}85%{opacity:1;background:#000}100%{opacity:1;background:#000}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:rgba(255,255,255,.7);font-size:11px;pointer-events:none;white-space:nowrap}
@media (pointer:coarse){#hint{display:none}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe3d0;font-weight:700;letter-spacing:.12em;background:#0b0f14;z-index:100}
#loading b{font-size:22px;color:#fff;letter-spacing:.2em}
#fade{position:fixed;inset:0;background:#05070c;opacity:0;pointer-events:none;transition:opacity .4s;z-index:80}
/* ---------- title ---------- */
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;color:#f3ead6}
#title{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#07090e;overflow:hidden;text-align:center}
#tBg{position:absolute;inset:-5%;background:center/cover no-repeat;image-rendering:pixelated;opacity:0}
#tBg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(8,10,18,.22),rgba(8,10,18,.84) 85%)}
#tFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tLine{position:absolute;left:8%;right:8%;top:40%;font-size:clamp(20px,3.4vw,32px);line-height:1.4;letter-spacing:.06em;opacity:0;text-shadow:0 2px 14px #000}
#tCast{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
#tCast i{position:absolute;top:0;width:min(24vw,230px);margin-left:calc(min(24vw,230px)/-2);transform:translateY(-50%);opacity:0}
#tCast img{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:50% 100%;filter:brightness(0)}
#tCast b{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;margin:-75% 0 0 -75%;border-radius:50%;border:5px solid var(--c);box-shadow:0 0 30px var(--c),inset 0 0 30px var(--c);opacity:0}
#tFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#tGate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#f1cf7e;letter-spacing:.32em;text-indent:.32em;font-size:clamp(15px,2.4vw,21px);cursor:pointer}
#tGate:before{content:"";width:16px;height:16px;border:1px solid #f1cf7e;background:#d6a84a;transform:rotate(45deg);box-shadow:0 0 24px rgba(241,207,126,.7);animation:gate 1.6s ease-in-out infinite}
#tGate span{animation:gate 1.6s ease-in-out infinite}
@keyframes gate{50%{opacity:.35}}
#tSkip{position:absolute;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;color:rgba(243,234,214,.55)}
#tMain{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px;padding:20px;pointer-events:none}
#tMain>*{opacity:0}
#title.gate #tGate{display:flex}
#title.intro #tSkip{display:block}
/* the opening: one line, the three starters, then the logo lands on bar five of the title theme (7.3 s) */
#title.intro #tLine{animation:tLine 2.5s .25s both}
@keyframes tLine{0%{opacity:0;transform:translateY(8px)}22%,74%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
#title.intro #tCast i{animation:castIn .9s var(--d) both,castOut .4s 7.2s forwards}
#title.intro #tCast img{animation:castCol .9s var(--d) both,kBob .9s 5.4s ease-in-out infinite}
#title.intro #tCast b{animation:castRing .7s calc(var(--d) + .38s) both}
@keyframes castIn{0%{opacity:0;transform:translateY(-22%) scale(.7)}38%{opacity:1;transform:translateY(-58%) scale(1.07)}60%,100%{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes castCol{0%,40%{filter:brightness(0)}46%{filter:brightness(0) invert(1)}62%,100%{filter:none}}
@keyframes castRing{0%{opacity:.95;transform:scale(.15)}100%{opacity:0;transform:scale(1.25)}}
@keyframes castOut{to{opacity:0;transform:translateY(-50%) scale(1.35)}}
@keyframes kBob{50%{transform:scale(1.03,.955)}}
#title.intro #tBg{animation:bgDim 1.8s 5.4s forwards,bgOn .25s 7.3s forwards,bgDrift 44s 7.3s ease-in-out infinite alternate}
@keyframes bgDim{to{opacity:.28}}
@keyframes bgOn{to{opacity:1}}
@keyframes bgDrift{from{transform:scale(1.03) translate(-1.2%,.8%)}to{transform:scale(1.1) translate(1.2%,-.8%)}}
#title.intro #tFlash{animation:tFl .9s 7.25s}
@keyframes tFl{0%{opacity:0}9%{opacity:1}100%{opacity:0}}
#title.intro #tLogo{animation:logoIn .65s 7.3s cubic-bezier(.2,1.5,.4,1) both,logoIdle 5s 8s ease-in-out infinite}
@keyframes logoIn{from{opacity:0;transform:scale(2.3) translateY(-24px)}to{opacity:1;transform:none}}
@keyframes logoIdle{0%,100%{transform:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) brightness(1)}44%{filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) brightness(1)}50%{transform:translateY(-7px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(246,220,147,.7)) brightness(1.3)}58%{filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) brightness(1)}}
#title.intro #tMain>:not(#tLogo){animation:rise .5s calc(7.9s + var(--n)*.14s) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#title.ready #tBg{opacity:1;animation:bgDrift 44s ease-in-out infinite alternate}
#title.ready #tMain{pointer-events:auto}
#title.ready #tMain>*{opacity:1}
#title.ready #tLogo{animation:logoIdle 5s ease-in-out infinite}
#title.ready.skip #tMain>*{animation:rise .4s calc(var(--n)*.06s) both}
#title.ready.skip #tLogo{animation:rise .4s both,logoIdle 5s .4s ease-in-out infinite}
#tRow{display:flex;gap:18px;justify-content:center;margin-top:4px}
#tRow .ic{--s:64px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
@media (max-height:560px){#tRow{display:none}}
#tLogo{width:min(620px,88vw);image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
#title h1{font-weight:400;letter-spacing:.34em;text-indent:.34em;font-size:clamp(30px,8vw,56px);margin:0;color:#f1cf7e;text-shadow:0 0 34px rgba(241,207,126,.35)}
#title h2{font-weight:400;font-size:clamp(14px,1.9vw,18px);letter-spacing:.26em;text-indent:.26em;color:#f3ead6;text-shadow:0 2px 6px #000;margin:0 0 20px;text-transform:uppercase}
.big{font-family:inherit;font-size:clamp(18px,2.2vw,21px);letter-spacing:.16em;padding:15px 30px;min-width:min(300px,78vw);border:1px solid #d6b46a;border-radius:4px;background:linear-gradient(180deg,#f6dc93,#d6a84a);color:#1a1408;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s,filter .12s}
.big:hover,.big.sel{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 22px rgba(246,220,147,.45)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.big.alt{background:rgba(12,13,22,.8);color:#f1cf7e}
.big small{display:block;font:500 12.5px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;margin-top:4px;opacity:.8}
#title p{font:500 13px/1.5 ui-sans-serif,system-ui,sans-serif;color:#d9d2c0;text-shadow:0 1px 4px #000;max-width:420px;margin:12px 0 0}
/* ---------- chooser ---------- */
#ch{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.68);padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#chB{position:relative;width:min(620px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#1a1e2e,#0c0d16);border:1px solid #d6b46a;border-radius:8px;padding:18px 18px 16px;box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 1px rgba(241,207,126,.1),inset 0 60px 60px -60px rgba(241,207,126,.12),0 18px 50px rgba(0,0,0,.65);touch-action:pan-y;animation:chIn .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes chIn{from{opacity:0;transform:translateY(14px) scale(.965)}}
#chT{display:flex;align-items:center;gap:11px;font-size:clamp(21px,2.9vw,26px);letter-spacing:.07em;color:#f1cf7e;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(214,180,106,.4)}
#chT:before{content:"";flex:0 0 auto;width:9px;height:9px;border:1px solid #f1cf7e;background:#d6a84a;transform:rotate(45deg);box-shadow:0 0 10px rgba(241,207,126,.6)}
#chT:empty{display:none}
#chH{font:500 15.5px/1.55 ui-sans-serif,system-ui,sans-serif;color:#d9d2c0;margin-bottom:10px}
#chH p{margin:0 0 7px}
#chH .dim,.chO .dim{color:#958f80}
.note{background:rgba(255,255,255,.05);border-left:3px solid #d6b46a;padding:10px 12px;border-radius:3px;margin-bottom:8px}
.note b{color:#f1cf7e;font-weight:600}
.card{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.card p{margin:0 0 8px}
.pf{position:relative;flex:0 0 auto;width:min(172px,36vw);aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9%;border-radius:8px;border:1px solid rgba(214,180,106,.32);overflow:hidden;background:radial-gradient(ellipse 62% 46% at 50% 70%,var(--c),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01))}
.pf:before{content:"";position:absolute;left:18%;right:18%;bottom:7%;height:10%;border-radius:50%;background:rgba(0,0,0,.38)}
.pf img{position:absolute;left:9%;bottom:11%;width:82%;height:78%;object-fit:contain;object-position:50% 100%;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:50% 100%;animation:kBob 2.2s ease-in-out infinite}
.xp{display:block;height:6px;margin:5px 0 2px;background:#07080c;border-radius:3px;overflow:hidden}
.xp u{display:block;height:100%;background:linear-gradient(90deg,#4f9bea,#8fd0ff);transform-origin:0 50%;animation:grow .6s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.card b{color:#fff;font-weight:600;font-size:clamp(18px,2.4vw,21px)}
.chip{display:inline-block;font:700 10.5px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px 3.5px;border-radius:3px;color:#10121a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stats span{background:rgba(255,255,255,.05);padding:8px 10px 9px;border-radius:3px;font-size:12px;color:#958f80;letter-spacing:.04em}
.stats b{display:block;color:#f3ead6;font-size:clamp(17px,2.2vw,20px);font-weight:600}
.stats em{display:block;height:4px;margin-top:5px;background:#07080c;border-radius:2px;overflow:hidden}
.stats u{display:block;height:100%;background:linear-gradient(90deg,#d6a84a,#f6dc93);transform-origin:0 50%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.dex span{display:flex;align-items:center;gap:6px;height:34px}
.dex b{color:#f1cf7e}
.ic{--s:48px;display:inline-block;flex:0 0 auto;width:var(--s);height:var(--s);background-size:calc(var(--s)*2) var(--s);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;animation:icA .8s steps(2) infinite}
@keyframes icA{to{background-position:calc(var(--s)*-2) 0}}
.dex .ic{--s:32px}
.chO{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1px solid rgba(214,180,106,.4);background:rgba(255,255,255,.04);color:#f3ead6;border-radius:5px;font-size:clamp(17px,2.2vw,20px);cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s,padding .12s;animation:optIn .24s calc(var(--i)*28ms) both}
@keyframes optIn{from{opacity:0}}
.chO span{flex:1 1 auto;min-width:0}
.chO b{font-weight:400;display:block}
.chO small{display:block;font:500 13px/1.4 ui-sans-serif,system-ui,sans-serif;color:#b9b09a;margin-top:3px}
.chO em{display:block;height:8px;background:#07080c;border:1px solid rgba(214,180,106,.3);border-radius:3px;margin-top:6px;overflow:hidden}
.chO u{display:block;height:100%;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.chO .ico{width:44px;height:44px;image-rendering:pixelated;image-rendering:crisp-edges;flex:0 0 auto}
.chO .pic{width:88px;height:88px;image-rendering:pixelated;image-rendering:crisp-edges}
.chO.sel{border-color:#f1cf7e;background:linear-gradient(90deg,rgba(241,207,126,.24),rgba(241,207,126,.07));box-shadow:0 0 0 1px rgba(241,207,126,.3),0 0 20px rgba(241,207,126,.16);padding-left:20px}
.chO.sel:before{content:"";position:absolute;left:6px;top:50%;width:7px;height:7px;margin-top:-4px;background:#f1cf7e;transform:rotate(45deg);animation:gate 1s ease-in-out infinite}
.chO[disabled]{opacity:.4;pointer-events:none}
.chO.back{border-style:dashed;color:#b9b09a;font-size:15px;padding:9px 14px}
.chO.back.sel{padding-left:22px}
#evo{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,#22304a,#05070c 75%)}
#evo.pop{background:radial-gradient(ellipse at center,#6a5a2a,#05070c 75%)}
#evoC{width:min(288px,70vw);height:min(288px,70vw);image-rendering:pixelated;image-rendering:crisp-edges}
#evoT{font-size:clamp(20px,2.8vw,26px);letter-spacing:.04em;text-align:center;padding:0 20px}
/* ---------- battle ---------- */
#b_app{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:#07080c;transition:opacity .4s;touch-action:none}
#b_app.open{display:flex}
#b_app.fade{opacity:0}
#b_stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#b_cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#b_bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .35s ease;z-index:3}
#b_bars i:first-child{top:0}#b_bars i:last-child{bottom:0}
#b_bars.on i{height:9%}
.plate{position:absolute;z-index:4;width:46%;max-width:340px;padding:10px 16px 11px;background:linear-gradient(180deg,rgba(18,21,33,.9),rgba(10,11,18,.82));border:1px solid rgba(214,180,106,.8);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(241,207,126,.18),0 6px 18px rgba(0,0,0,.45);border-radius:4px;transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1)}
.plate:before,.plate:after{content:"";position:absolute;width:7px;height:7px;border:1px solid #d6b46a;transform:rotate(45deg);background:#12131c;top:50%;margin-top:-4px}
.plate:before{left:-4px}.plate:after{right:-4px}
.plate .nm{font-size:clamp(17px,2.1vw,22px);letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}

.hpb{height:11px;background:#07080c;border:1px solid rgba(214,180,106,.55);padding:1px;border-radius:3px}
.hpb i{display:block;height:100%;width:100%;border-radius:1px;background:linear-gradient(180deg,#8fe38b,#3fae4f);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .6s cubic-bezier(.3,.7,.2,1),background .3s}
.xpb{height:4px;background:#07080c;margin-top:3px;border-radius:2px;overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:#6fb6ff;transition:width .6s}
.hpn{font:600 clamp(12px,1.4vw,14px)/1 ui-sans-serif,system-ui,sans-serif;text-align:right;margin-top:5px;color:#cfc6b0;letter-spacing:.05em}
.stg{font:700 9.5px/1.3 ui-sans-serif,system-ui,sans-serif;color:#9fd0ff;letter-spacing:.04em;min-height:12px;margin-top:3px}
#b_pFoe{right:3%;top:calc(4% + env(safe-area-inset-top))}

.plate.hide{opacity:0;transform:translateY(-12px)}
#b_tr{position:absolute;z-index:3;left:74%;bottom:31%;height:48%;image-rendering:pixelated;image-rendering:crisp-edges;opacity:0;transform:translateX(-50%) translateX(50px);transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
#b_tr.in{opacity:1;transform:translateX(-50%)}
#b_panel{flex:0 0 auto;position:relative;z-index:5;background:linear-gradient(180deg,#12131c,#0a0b12);border-top:1px solid #d6b46a;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.6)}
#b_msg{min-height:52px;font-size:clamp(17.5px,2.1vw,21px);line-height:1.35;padding:2px 4px 9px;letter-spacing:.01em}
#b_msg b{color:#f1cf7e;font-weight:400}
#b_moves{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mv{position:relative;text-align:left;padding:11px 10px 10px 15px;border:1px solid rgba(214,180,106,.45);background:rgba(255,255,255,.04);color:#f3ead6;border-radius:4px;font-family:inherit;font-size:clamp(16px,1.9vw,19px);cursor:pointer;overflow:hidden;transition:background .15s,transform .08s,border-color .15s,box-shadow .15s}
.mv:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.mv small{display:flex;justify-content:space-between;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;color:#b9b09a;margin-top:6px;text-transform:uppercase}
.mv:active{transform:scale(.98)}

.mv.se{border-color:#8fe38b}.mv.nve{opacity:.72}

#b_resRow{display:flex;align-items:stretch;gap:6px;margin-top:8px}

}

#b_lvl:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:34%;background:linear-gradient(100deg,transparent,rgba(255,244,210,.22),transparent);transform:skewX(-18deg)}
